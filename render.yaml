services:
  - type: web
    name: distress-detection-pothole
    env: python
    plan: pro               # ✅ Pro instance: 4 GB RAM / 2 CPU
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: >
      gunicorn --worker-class eventlet --workers 2 --threads 1 --timeout 600 --bind 0.0.0.0:$PORT app:app

    envVars:
      - key: FLASK_ENV
        value: production
      - key: MODEL_TYPE
        value: vit_b
      - key: MAX_CONTENT_LENGTH
        value: "16777216"       # 16 MB upload limit
      - key: DATABASE_URL
        value: "sqlite:///potholes.db"
      - key: PYTHONUNBUFFERED
        value: "1"

    disk:
      name: persistent-data
      mountPath: /var/data
      sizeGB: 2                 # ✅ 2 GB persistent disk

    healthCheckPath: /
    autoDeploy: true

    # Optional: restrict concurrency slightly for stable performance
    concurrency:
      type: connections
      softLimit: 5
      hardLimit: 10
