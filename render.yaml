# 🚀 Render Deployment Configuration for Distress Detection (Pothole)
# Optimized for 1 GB RAM (Standard Plan) and persistent SAM model storage

services:
  - type: web
    name: distress-detection-pothole
    env: python
    plan: standard   # 🧠 Standard = better memory & stability

    buildCommand: |
      set -e
      echo "=== 🧠 Starting build for distress-detection-pothole ==="
      pip install --upgrade pip
      pip install -r requirements.txt

      MODEL_PATH="/data/models/sam_vit_b_01ec64.pth"
      echo "=== Checking SAM model at ${MODEL_PATH} ==="

      # ✅ Skip download if model already stored in persistent disk
      if [ -f "${MODEL_PATH}" ]; then
        echo "✅ SAM model already exists in persistent disk — skipping download."
      else
        echo "⬇️ Model not found — please upload manually at /upload_model after first deploy."
        mkdir -p /data/models
      fi

      ls -lh "${MODEL_PATH}" || echo "⚠️ SAM model not yet uploaded!"

    # 🧠 One worker = less RAM pressure
    startCommand: gunicorn --worker-class eventlet --workers 1 --threads 2 --bind 0.0.0.0:$PORT --timeout 600 app:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: MODEL_DIR
        value: /data/models
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1
      - key: DB_HOST
        value: dpg-d3su87c9c44c73cdki1g-a.oregon-postgres.render.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: distress_db
      - key: DB_USER
        value: distress_db_user
      - key: DB_PASSWORD
        value: xZLgwESqa0z9OeMtZiAlYbidFQqLHDMv
      - key: UPLOAD_FOLDER
        value: uploads
      - key: MAX_CONTENT_LENGTH
        value: "1073741824"  # 1 GB upload limit for model/video files

    healthCheckPath: /health

# 🗂 Persistent Disk (for model + uploads)
disks:
  - name: sam-model-storage
    mountPath: /data/models
    sizeGB: 1
