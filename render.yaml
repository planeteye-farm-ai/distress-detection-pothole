services:
  - type: web
    name: distress-detection-pothole
    env: python
    plan: standard   # 🧠 Standard = better memory & stability

    buildCommand: |
      set -e
      echo "=== 🧠 Starting build for distress-detection-pothole ==="
      pip install --upgrade pip
      pip install -r requirements.txt

      MODEL_PATH="/data/models/sam_vit_b_01ec64.pth"
      echo "=== Checking SAM model at ${MODEL_PATH} ==="

      # ✅ Ensure the model exists or download it once
      if [ ! -f "${MODEL_PATH}" ] || [ $(stat -c%s "${MODEL_PATH}" 2>/dev/null || echo 0) -lt 375000000 ]; then
        echo "⬇️ Downloading SAM model to persistent disk..."
        mkdir -p /data/models
        curl -L --progress-bar -o "${MODEL_PATH}" \
          "https://huggingface.co/AkhileshYR/sam-vit-b-model/resolve/main/sam_vit_b_01ec64.pth" \
          || echo "⚠️ Download failed — you can manually upload later at /upload_model"
      else
        echo "✅ SAM model already present on persistent disk."
      fi

      ls -lh "${MODEL_PATH}" || echo "⚠️ SAM model not found!"

    startCommand: gunicorn --worker-class eventlet --workers 2 --threads 4 --bind 0.0.0.0:$PORT --timeout 600 app:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: MODEL_DIR
        value: /data/models
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: DB_HOST
        value: dpg-d3su87c9c44c73cdki1g-a.oregon-postgres.render.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: distress_db
      - key: DB_USER
        value: distress_db_user
      - key: DB_PASSWORD
        value: xZLgwESqa0z9OeMtZiAlYbidFQqLHDMv
      - key: UPLOAD_FOLDER
        value: uploads
      - key: MAX_CONTENT_LENGTH
        value: "1073741824"  # 1 GB limit for model upload

    healthCheckPath: /health

# 🗂 Persistent Disk (mounted before build & runtime)
disks:
  - name: sam-model-storage
    mountPath: /data/models
    sizeGB: 1
